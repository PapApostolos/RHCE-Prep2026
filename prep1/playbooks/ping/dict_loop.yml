# This is a dictionary example
---
- name: Playbook with Dictionary Loops
  hosts: RHEL-SERVERS

  become: true
  gather_facts: false

  vars_files:
    - ./vars/playbook_vars.yml

  tasks:

    - name: Ensure group-user combination
      tags: display
      loop: "{{ ans_users | product(ans_groups) | list }}"
      ansible.builtin.debug:
        msg: >-
          User: {{ item[0] }}, groups: {{ item[1] }}

    - name: Ensure group existance of remote hosts
      loop: "{{ ans_groups }}"
      ansible.builtin.group:
        name: "{{ item }}"

    - name: Ensure Users have the proper groups
      loop: "{{ ans_users_info }}"
      ansible.builtin.user:
        name: "{{ item['name'] }}"
        groups: "{{ item['groups'] }}"
        password: "{{ item['password'] | default('redhat') | password_hash('sha512')  }}"

...
