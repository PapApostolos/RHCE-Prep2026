---
- name: "Host Patterns"

  # hosts: "{{ my_host | default('all:!rhel-server2') }}"
  # hosts: "{{ ans_host | default('rhel-server*') }}"
  hosts: "{{ my_host | default('RHEL-SERVERS,&MIRROR-SERVERS') }}"
  # hosts: "{{ my_host | default('rhel-server3,rhel-server2') }}"

  order: "{{ ans_order | default('inventory') }}"

  gather_facts: false

  vars:
    user_state: "present"

  tasks:

    - name: Display Connection Information
      changed_when: false
      ansible.builtin.debug:
        msg: >
          The {{ inventory_hostname }} has address {{ ansible_host }}

...
