# playbooks/ping/conditionals.yml
---
- name: Conditionals and Loops
  hosts: "{{ ans_hosts | default('RHEL-SERVERS') }}"

  become: true
  gather_facts: false

  vars:
    ans_groups:
      - devops
      - sysadmins

    ans_users:
      - guest
      - natasha
      - sysadmin1

  tasks:
    - name: Display Groups
      loop: "{{ ans_groups }}"
      ansible.builtin.debug:
        msg: "Group {{ item }}"

    - name: Ensure desired group exists
      loop: "{{ ans_groups }}"
      ansible.builtin.group:
        name: "{{ item }}"
        state: present

    - name: Ensure user exist
      loop: "{{ ans_users }}"
      ansible.builtin.user:
        name: "{{ item }}"
        state: present
        password: "{{ ans_password | default('redhat') | password_hash('sha512') }}"

...
