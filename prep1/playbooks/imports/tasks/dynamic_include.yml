# Dynamic import
---
- name: Shell Example
  changed_when: false
  register: shell_output
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail && false
      cat /etc/resolv.conf | grep nameserver

- name: Dispaly Result
  ansible.builtin.debug:
    msg: "{{ shell_output.stdout }}"
...
