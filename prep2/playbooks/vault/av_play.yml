---
- name: Ansible vault playbook
  hosts: "{{ ans_hosts | default('LOCAL_SERVERS')}}"
  
  gather_facts: false

  vars_files:
    ./secrets.yml  

  tasks:
    - name: Display Encrytped Variables
      ansible.builtin.debug:
        msg: | 
          The ecrypted values are
          - server: {{ vault_server }}
          - username: {{ vault_user }},
          - password: {{ vault_passwd }}
...

