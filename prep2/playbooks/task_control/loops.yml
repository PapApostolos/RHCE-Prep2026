---
- name: Loop Playbook
  hosts: "{{ ans_hosts | default('WORK_SERVERS') }}"
 
  gather_facts: false

  vars:
    
    ans_state: present

    ans_msgs:
      - "1st Message"
      - "2nd Message"
      - "3rd Message"
    
    ans_users:
      - name: ans_user1
        groups:
          - wheel
          - devops
          
      - name: ans_user2
        groups:
          - wheel
          - sysadmins

  tasks:
    - name: List Iteration
      loop: "{{ ans_msgs }}"
      ansible.builtin.debug:
        msg: >-
          List Item: {{ item }}

    - name: Ensure Automation user existance
      become: true
      loop: "{{ ans_users }}"
      ansible.builtin.user:
        name: "{{ item['name'] }}"
        groups: "{{ item['groups'] }}"
        state: "{{ ans_state }}"

...
