# playbooks/system/command.yml
---
- name: Command Module Examples
  hosts: "{{ ans_hosts | default('LOCAL_SERVERS') }}"

  gather_facts: false

  vars:
    ans_command: "cat /etc/hosts"
    ans_shell: "whoami; hostname; ip -br a s"

  tasks:
    - name: Execute 'command' remotely
      register: ans_command_result
      ansible.builtin.command:
        cmd: "{{ ans_command }}"

    - name: Execute 'shell' command remotely
      register: ans_shell_result
      ansible.builtin.shell:
        cmd: "{{ ans_shell }}"

    - name: Display command result
      ansible.builtin.debug:
        msg: "{{ ans_command_result['stdout_lines'] }}"

    - name: Display Shell result
      ansible.builtin.debug:
        msg: "{{ ans_shell_result['stdout_lines'] }}"
...
